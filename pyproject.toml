[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyingestion"
version = "0.5.3b1"
description = "General-purpose document data ingestion library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.0",
    "pypdf>=6.13.0",
    "rich>=13.7.1",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
]


[project.scripts]
pyingestion = "pyingestion.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyingestion*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff"
]
rag = [
    "sentence-transformers>=3.0.0",
]

[tool.setuptools.package-data]
pyingestion = ["locale/**/*.po", "locale/**/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
# Standardize line length to match modern Python practices (default is 88)
line-length = 88
# Set the target version to match your pyproject.toml requires-python
target-version = "py310" 

[tool.ruff.lint]
# Enable standard linting rules:
# E: pycodestyle errors
# F: Pyflakes (logical errors like unused variables)
# I: isort (import sorting)
select = ["E", "F", "I"]

# Disable rules to match your basedpyright configuration:
ignore = [
    # Matches 'reportUnusedImport = "none"'
    "F401", 
    
    # Matches 'reportUnusedParameter = "none"'
    "ARG",  
    
    # Matches 'reportMissingTypeArgument', 'reportMissingParameterType' 
    # (Disables strict type annotation enforcement if you were to enable the ANN rule group)
    "ANN",  
    
    # Matches 'reportConstantRedefinition = "none"'
    "F811", 
    
    # Ignored to match Pyright's relaxed approach to unused locals in your config
    "F841", 
]

[tool.ruff.format]
# Keep formatting consistent
quote-style = "double"
indent-style = "space"